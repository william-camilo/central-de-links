<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central de Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: single-page app, hash-routed (home / tema detail / relatório).
   Dark-first — this is the approved mockup's own palette, not the artifact
   default dark: deep near-black ground, cool ink cards, periwinkle accent. */
:root{
  --bg:#0B0E14; --card:#12161F; --card-border:#1E2430; --card-border-soft:#1B2029;
  --ink:#E8EAF0; --ink-strong:#F5F6FA; --ink-mute:#8A91A5; --ink-faint:#7A8194;
  --accent:#7C9CFF; --accent-wash:rgba(124,156,255,0.14); --accent-wash-soft:rgba(124,156,255,0.08);
  --good:#34D399; --warn:#FBBF24; --warn-wash:rgba(251,191,36,0.1);
  --line:#2A3040; --display:'Space Grotesk',sans-serif; --body:'Plus Jakarta Sans',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{color:#A5BBFF}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{text-wrap:balance;margin:0}
.hidden{display:none!important}

.app{max-width:460px;margin:0 auto;padding-inline:20px;position:relative}
.screen{padding-block:22px 100px;display:flex;flex-direction:column;gap:18px}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{flex-shrink:0}
.brand span{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-0.01em;color:var(--ink-strong)}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.icon-btn:hover{border-color:var(--line)}
.backbtn{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* status pill */
.status{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--card-border);border-radius:999px;padding:7px 12px 7px 10px;align-self:flex-start;font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex-shrink:0}
.status .muted{color:var(--ink-faint)}
.status .sep{width:3px;height:3px;border-radius:50%;background:#3A4055;flex-shrink:0}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--card-border);border-radius:13px;padding:0 14px;height:46px}
.search svg{flex-shrink:0}
.search input{all:unset;flex-grow:1;color:var(--ink);font-size:14px}
.search input::placeholder{color:var(--ink-faint)}

/* report CTA */
.report-cta{display:flex;align-items:center;gap:12px;background:#141A28;border:1px solid #2A3350;border-radius:16px;padding:14px}
.report-cta .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-wash);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.report-cta .txt{flex-grow:1;min-width:0}
.report-cta .txt b{display:block;font-size:13.5px;font-weight:700;color:var(--ink-strong)}
.report-cta .txt small{display:block;font-size:11.5px;color:var(--ink-mute);margin-top:2px}
.btn-accent{display:flex;align-items:center;gap:6px;background:var(--accent);color:#0B0E14;font-size:12.5px;font-weight:700;padding:0 14px;height:44px;border-radius:11px;border:none;flex-shrink:0}

/* section label */
.section-label{font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--ink-strong)}

/* themes grid */
.themes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.theme-card{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--card-border);border-radius:13px;padding:12px;text-align:left;border-style:solid}
.theme-card .name{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink)}
.theme-card .swatch{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.theme-card .meta{font-size:11.5px;color:var(--ink-faint)}
.theme-card.new{align-items:center;justify-content:center;gap:6px;background:transparent;border:1px dashed #2A3040;color:var(--ink-mute);font-size:12.5px;font-weight:600;flex-direction:row}

/* link cards (recentes / tema list) */
.recent-list{display:flex;flex-direction:column;gap:10px}
.recent-card{display:flex;gap:11px;background:var(--card);border:1px solid var(--card-border-soft);border-radius:14px;padding:10px;text-align:left;align-items:stretch}
.recent-card img,.thumb-placeholder{width:62px;height:62px;border-radius:9px;object-fit:cover;flex-shrink:0;background:#1A1F2B;display:flex;align-items:center;justify-content:center}
.recent-body{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.recent-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.recent-when{font-size:10.5px;color:var(--ink-faint);flex-shrink:0}
.recent-title{font-size:13px;font-weight:700;color:var(--ink-strong);line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.recent-sub{font-size:10.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* empty / loading / error */
.state-block{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:36px 12px;color:var(--ink-mute);font-size:13px}
.state-block b{color:var(--ink)}

/* FAB */
.fab{position:fixed;right:calc(50% - 230px + 20px);bottom:26px;width:56px;height:56px;border-radius:17px;background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px rgba(124,156,255,0.32);z-index:5}
@media (max-width:500px){ .fab{right:20px} }

/* tema view */
.tema-head{display:flex;flex-direction:column;gap:6px}
.tema-head .title-row{display:flex;align-items:center;gap:9px}
.tema-head .swatch{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.tema-head h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-0.02em;color:var(--ink-strong)}
.tema-head .meta{font-size:12.5px;color:var(--ink-mute)}
.btn-pdf{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:13px;background:var(--accent);border:none;color:#0B0E14;font-size:14px;font-weight:700}

.item-card{display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--card-border-soft);border-radius:16px;padding:15px}
.item-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge-type{background:#1E2430;color:#C7CCDA;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:999px}
.badge-video{display:flex;align-items:center;gap:5px;background:rgba(45,212,191,0.12);color:#2DD4BF;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:999px}
.item-author{font-size:11px;color:var(--ink-faint)}
.item-img{width:100%;border-radius:10px;display:block;object-fit:cover;max-height:280px}
.item-label{font-size:10.5px;font-weight:700;letter-spacing:0.06em;color:var(--ink-faint)}
.item-title{font-size:15.5px;font-weight:700;color:var(--ink-strong);line-height:1.3;margin-top:3px}
.item-caption{font-size:12.5px;color:#AEB4C2;line-height:1.5;margin-top:4px;border-left:2px solid #2A3040;padding-left:10px}
.item-summary{font-size:13px;color:#E0E3EA;line-height:1.5;margin-top:4px}
.vid-status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#2DD4BF;background:rgba(45,212,191,0.08);border:1px solid rgba(45,212,191,0.22);border-radius:10px;padding:7px 10px}
.vid-status.warn{color:#FBBF24;background:rgba(251,191,36,0.08);border-color:rgba(251,191,36,0.25)}
.tool-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tool-chip{font-size:11.5px;font-weight:600;color:#C7CCDA;background:#1E2430;border-radius:999px;padding:4px 9px}
.vid-details{border:1px solid var(--card-border-soft);border-radius:12px;background:rgba(255,255,255,0.02)}
.vid-details>summary{cursor:pointer;list-style:none;padding:10px 12px;font-size:12px;font-weight:700;color:#C7CCDA;display:flex;justify-content:space-between;align-items:center}
.vid-details>summary::-webkit-details-marker{display:none}
.vid-details>summary::after{content:"+";font-size:16px;color:var(--ink-faint)}
.vid-details[open]>summary::after{content:"–"}
.vid-body{padding:0 12px 12px;font-size:12.5px;line-height:1.55;color:#D5D9E3;white-space:pre-wrap;max-height:340px;overflow:auto}
.vid-body ul{margin:0;padding-left:18px;white-space:normal}
.vid-body li{margin:3px 0}
.vid-copy{margin:0 12px 12px;font-size:11.5px;font-weight:700;color:#7C9CFF;background:none;border:1px solid rgba(124,156,255,0.35);border-radius:8px;padding:6px 10px;cursor:pointer}
.item-note{display:flex;align-items:center;gap:6px;background:var(--warn-wash);border-radius:9px;padding:9px 11px;font-size:11.5px;color:var(--warn)}
.cited-list{display:flex;flex-direction:column;gap:6px}
.cited-link{display:flex;align-items:center;gap:8px;background:var(--accent-wash-soft);border-radius:9px;padding:9px 11px;font-size:12px;font-weight:600;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.no-cited{font-size:11.5px;color:var(--ink-faint)}
.orig-link{font-size:11px;color:var(--ink-faint)}
.orig-link a{color:var(--accent)}

/* relatório (report) view — paper look, intentionally breaks from the dark shell */
.report-wrap{background:#F2F3F6;border-radius:16px;padding:16px}
.report-note{font-size:12px;color:var(--ink-mute);padding:2px 4px 14px;line-height:1.5}
.paper{background:#FFFFFF;color:#1A1D24;border-radius:6px;padding:32px 26px;display:flex;flex-direction:column;gap:20px;font-family:var(--body)}
.paper-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1A1D24;padding-bottom:12px;gap:12px;flex-wrap:wrap}
.paper-head .eyebrow{font-size:9.5px;font-weight:700;letter-spacing:0.12em;color:#5A6072}
.paper-head h2{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-0.02em;margin-top:4px}
.paper-head .gen{text-align:right;font-size:10px;color:#5A6072;line-height:1.5}
.paper-section-head{display:flex;align-items:center;gap:8px;background:#F2F4F8;border-radius:6px;padding:8px 12px}
.paper-section-head .swatch{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.paper-section-head .name{font-family:var(--display);font-size:14px;font-weight:700}
.paper-section-head .count{font-size:10px;color:#5A6072;margin-left:auto}
.paper-item{display:flex;flex-direction:column;gap:4px;padding:0 4px}
.paper-item .t{font-size:12.5px;font-weight:700}
.paper-item .meta{font-size:9.5px;color:#5A6072}
.paper-item .sum{font-size:10.5px;line-height:1.5}
.paper-item .sum b{font-weight:700}
.paper-item .links{font-size:10px;line-height:1.6}
.paper-hr{height:1px;background:#E3E6EC}

.link-plain{color:var(--accent);word-break:break-all}

/* PDF picker modal */
.modal-overlay{position:fixed;inset:0;background:rgba(5,7,12,0.72);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:16px;backdrop-filter:blur(2px)}
@media (min-width:520px){ .modal-overlay{align-items:center} }
.modal-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;max-height:78vh;overflow:auto}
.modal-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.modal-card h3{font-family:var(--display);font-size:15.5px;font-weight:700;color:var(--ink-strong)}
.modal-card .sub{font-size:11.5px;color:var(--ink-mute);margin-top:2px}
.modal-close{flex-shrink:0;width:30px;height:30px;border-radius:9px;background:#1A1F2B;border:1px solid var(--card-border);color:var(--ink-mute);font-size:14px;display:flex;align-items:center;justify-content:center;padding:0}
.modal-opts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.modal-opt{display:flex;flex-direction:column;gap:2px;text-align:left;background:#161B26;border:1px solid var(--card-border-soft);border-radius:12px;padding:12px 14px;width:100%}
.modal-opt:hover,.modal-opt:focus-visible{border-color:var(--accent)}
.modal-opt b{font-size:13px;color:var(--ink-strong);font-weight:700}
.modal-opt span{font-size:11px;color:var(--ink-faint)}
.modal-opt.all{background:var(--accent-wash-soft);border-color:#33406A}

/* delete controls */
.theme-card{position:relative;padding-top:26px}
.theme-del{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:7px;background:rgba(0,0,0,0.28);border:none;display:flex;align-items:center;justify-content:center;padding:0}
.theme-del:hover{background:rgba(239,68,68,0.3)}
.item-del{width:28px;height:28px;border-radius:9px;background:#1A1F2B;border:1px solid var(--card-border-soft);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;margin-left:auto}
.item-del:hover{border-color:#EF4444;background:rgba(239,68,68,0.12)}
.tema-del-btn,.danger-btn{border-radius:12px;background:var(--card);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tema-del-btn{width:44px;height:44px}
.tema-del-btn:hover,.danger-btn:hover{border-color:#EF4444;background:rgba(239,68,68,0.1)}
.danger-zone{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.25);border-radius:13px;padding:11px 14px}
.danger-zone .txt{font-size:11.5px;color:#F0A6A6;line-height:1.4}
.danger-zone .txt b{color:#FF8B8B;display:block;font-size:12.5px;margin-bottom:1px}
.danger-btn{height:38px;padding:0 13px;gap:6px;font-size:11.5px;font-weight:700;color:#FF8B8B;white-space:nowrap}

/* carrossel de imagens */
.img-carousel{position:relative;margin:2px -2px 0}
.img-carousel .strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:6px;border-radius:11px;-webkit-overflow-scrolling:touch}
.img-carousel .strip::-webkit-scrollbar{display:none}
.img-carousel .strip img{scroll-snap-align:start;flex:0 0 100%;width:100%;max-height:340px;object-fit:cover;border-radius:11px;background:#1A1F2B}
.img-carousel .count{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.55);color:#fff;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;pointer-events:none}
.thumb-row{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px}
.thumb-btn{width:100%;aspect-ratio:1;border-radius:9px;padding:0;border:2px solid transparent;background:#1A1F2B;overflow:hidden}
.thumb-btn img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-btn.active{border-color:var(--accent)}
.btn-download-imgs{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:36px;margin-top:8px;border-radius:11px;background:var(--card);border:1px solid var(--card-border);color:var(--accent);font-size:11.5px;font-weight:700}
.btn-download-imgs:hover{border-color:var(--accent)}
.btn-download-imgs[disabled]{opacity:0.55;pointer-events:none}

/* revisão de categorias */
.review-cta{display:flex;align-items:center;gap:10px;background:var(--warn-wash);border:1px solid rgba(251,191,36,0.35);border-radius:14px;padding:12px 14px;color:var(--warn);font-size:12.5px;font-weight:700}
.review-cta span{flex-grow:1}
.review-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--warn);background:var(--warn-wash);border-radius:999px;padding:3px 8px}
.review-card{display:flex;flex-direction:column;gap:9px;background:var(--card);border:1px solid var(--card-border-soft);border-radius:16px;padding:14px}
.review-card .t{font-size:13.5px;font-weight:700;color:var(--ink-strong);line-height:1.3}
.review-card .why{font-size:11.5px;color:var(--warn);line-height:1.4}
.review-card .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn-soft{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 12px;border-radius:10px;background:#161B26;border:1px solid var(--card-border);color:var(--ink);font-size:12px;font-weight:700}
.btn-soft.primary{background:var(--accent);border-color:var(--accent);color:#0B0E14}
.btn-soft.danger{color:#EF4444}
.btn-soft[disabled]{opacity:0.5;pointer-events:none}
.sel{height:38px;border-radius:10px;background:#161B26;border:1px solid var(--card-border);color:var(--ink);font-size:12px;padding:0 8px;font-family:inherit;max-width:100%}
/* configurações / chaves */
.key-card{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--card-border-soft);border-radius:14px;padding:13px}
.key-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.key-top b{font-size:13.5px;color:var(--ink-strong)}
.key-mask{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ink-faint)}
.pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.pill.ok{background:rgba(52,211,153,0.12);color:var(--good)}
.pill.warn{background:var(--warn-wash);color:var(--warn)}
.pill.bad{background:rgba(239,68,68,0.12);color:#EF4444}
.pill.off{background:#1A1F2B;color:var(--ink-faint)}
.key-meta{font-size:11px;color:var(--ink-faint);line-height:1.45;word-break:break-word}
.form-card{display:flex;flex-direction:column;gap:8px;background:#141A28;border:1px solid #2A3350;border-radius:14px;padding:14px}
.inp{height:42px;border-radius:10px;background:var(--bg);border:1px solid var(--card-border);color:var(--ink);font-size:13px;padding:0 12px;font-family:inherit;width:100%}
.hint{font-size:11.5px;color:var(--ink-mute);line-height:1.5}
.msg{font-size:12px;line-height:1.45;border-radius:10px;padding:9px 11px}
.msg.ok{background:rgba(52,211,153,0.1);color:var(--good)}
.msg.err{background:rgba(239,68,68,0.1);color:#F87171}
</style>

<form class="global-search" id="global-search-form" role="search"><label for="global-search-input">Pesquisar em toda a biblioteca</label><div class="global-search-control"><input id="global-search-input" type="search" placeholder="Digite qualquer palavra ou trecho…" autocomplete="off" aria-describedby="global-search-hint"><button type="submit">Pesquisar</button></div><small id="global-search-hint">Títulos, resumos, transcrições, textos da tela e referências. Maiúsculas e acentos não fazem diferença.</small></form>

  <div id="tema" class="screen hidden"></div>
  <div id="relatorio" class="screen hidden"></div>

  <div id="config" class="screen hidden"></div>
</main>

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function timeAgo(iso){
  if(!iso) return '';
  var d = new Date(iso), now = new Date();
  var days = Math.floor((now - d) / 86400000);
  if(days <= 0) return 'hoje';
  if(days === 1) return '1 d';
  if(days < 30) return days + ' d';
  var months = Math.floor(days/30);
  return months + (months===1 ? ' mês' : ' meses');
}
function domainOf(url){
  try{ return new URL(url).hostname.replace(/^www\./,''); }catch(e){ return url; }
}
function isVideo(mt){ return /video|reel/i.test(mt||''); }
var ACCENT_MAP = {'á':'a','à':'a','â':'a','ã':'a','ä':'a','é':'e','è':'e','ê':'e','ë':'e','í':'i','ì':'i','î':'i','ï':'i','ó':'o','ò':'o','ô':'o','õ':'o','ö':'o','ú':'u','ù':'u','û':'u','ü':'u','ç':'c','ñ':'n'};
function slugify(s){
  var str = String(s||'').toLowerCase().split('').map(function(ch){ return ACCENT_MAP[ch] || ch; }).join('');
  return str.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'item';
}
function hexRgb(hex){
  hex = String(hex||'#000000').replace('#','');
  if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
  var num = parseInt(hex,16) || 0;
  return [(num>>16)&255,(num>>8)&255,num&255];
}
function todayStr(){

}
function todayFileStamp(){

}

// ---------- PDF picker (modal) ----------
var pickerReturnFocus = null;
function closePicker(){
  var ov = document.getElementById('pdf-picker-overlay');
  if(ov) ov.remove();
  document.removeEventListener('keydown', onPickerKey);
  if(pickerReturnFocus && pickerReturnFocus.isConnected) pickerReturnFocus.focus();
}
function onPickerKey(e){
  if(e.key === 'Escape') closePicker();
  if(e.key === 'Tab'){
    var controls = document.querySelectorAll('#pdf-picker-overlay button');
    var first = controls[0], last = controls[controls.length-1];
    if(e.shiftKey && document.activeElement === first){e.preventDefault();last.focus();}
    else if(!e.shiftKey && document.activeElement === last){e.preventDefault();first.focus();}
  }
}

// ---------- PDF generation (real downloadable file, via jsPDF) ----------
function buildReportScope(scope){
  if(scope.type === 'selection'){
    return { title: scope.title || 'Seleção de links', cats: themeCategories(), itemsOf: function(c){ return linksByCategory(c.id).filter(function(l){ return scope.ids.indexOf(l.id) !== -1; }); }, filename: 'central-de-links-selecao' };
  }
  if(scope.type === 'category'){
    var cat = themeCategories().find(function(c){ return c.id === scope.catId; });
    return { title: cat ? cat.name : 'Tema', cats: cat ? [cat] : [], itemsOf: function(c){ return linksByCategory(c.id); }, filename: 'central-de-links-'+slugify(cat?cat.name:'tema') };
  }
  if(scope.type === 'link'){
    var link = state.links.find(function(l){ return l.id === scope.linkId; });
    var cat2 = link ? themeCategories().find(function(c){ return c.id === link.category_id; }) || {id:'__uncategorized',name:'Sem categoria'} : null;
    return { title: (link?(link.title||'Link'):'Link')+(cat2?' — '+cat2.name:''), cats: cat2 ? [cat2] : [], itemsOf: function(){ return link ? [link] : []; }, filename: 'central-de-links-'+slugify(link?link.title:'item') };
  }
  // 'all'
  return { title: 'Relatório completo', cats: themeCategories(), itemsOf: function(c){ return linksByCategory(c.id); }, filename: 'central-de-links-completo' };
}

function generatePdf(scope){
  if(!window.jspdf){ alert('Não consegui carregar o gerador de PDF. Recarregue a página e tente de novo.'); return; }
  var rep = buildReportScope(scope);
  var doc = new window.jspdf.jsPDF({ unit:'pt', format:'a4' });
  var pageW = doc.internal.pageSize.getWidth();
  var pageH = doc.internal.pageSize.getHeight();
  var margin = 50;
  var contentW = pageW - margin*2;
  var y = margin;

  function ensure(h){ if(y + h > pageH - margin){ doc.addPage(); y = margin; } }
  function color(c){ doc.setTextColor.apply(doc, hexRgb(c)); }
  function text(str, size, opts){
    opts = opts || {};
    doc.setFont('helvetica', opts.bold ? 'bold' : (opts.italic ? 'italic' : 'normal'));
    doc.setFontSize(size);
    color(opts.color || '#1A1D24');
    var indent = opts.indent || 0;
    var lines = doc.splitTextToSize(String(str), contentW - indent);
    lines.forEach(function(line){
      ensure(size*1.42);
      doc.text(line, margin + indent, y);
      y += size*1.42;
    });
  }
  function spacer(h){ y += h; }
  function rule(){ ensure(8); doc.setDrawColor.apply(doc, hexRgb('#E3E6EC')); doc.line(margin, y, pageW-margin, y); y += 14; }

  // header
  text('CENTRAL DE LINKS', 9, { bold:true, color:'#5A6072' });
  spacer(4);
  text(rep.title, 20, { bold:true, color:'#1A1D24' });
  spacer(2);
  text('Gerado em '+todayStr(), 9, { color:'#5A6072' });
  spacer(8);
  rule();

  var catsWithItems = rep.cats.filter(function(c){ return rep.itemsOf(c).length > 0; });
  if(catsWithItems.length === 0){
    text('Sem conteúdo processado ainda pra este recorte.', 11, { color:'#5A6072' });
  }

  catsWithItems.forEach(function(c, idx){
    var items = rep.itemsOf(c);
    ensure(28);
    text((idx+1)+'. '+c.name+'  ('+items.length+' link'+(items.length===1?'':'s')+')', 13, { bold:true });
    spacer(6);
    items.forEach(function(l, i){
      ensure(18);
      text((idx+1)+'.'+(i+1)+' '+(l.title||'(sem título)'), 11.5, { bold:true });
      text((l.media_type||'link')+' · '+domainOf(l.raw_url)+' · '+todayFromIso(l.processed_at), 9, { color:'#5A6072' });
      if(l.caption){ text('"'+l.caption+'"', 9.5, { italic:true, color:'#3A3F4B', indent:8 }); }
      if(l.summary){ text((l.summary_inferred ? 'Resumo estimado (conteúdo não lido): ' : 'Resumo: ')+l.summary, 10, { color:'#1A1D24' }); }
      if(!l.caption && !l.summary){ text('O conteúdo não pôde ser lido automaticamente.', 9, { italic:true, color:'#A5760B' }); }
      if(l.cited_links && l.cited_links.length){
        text('Links mencionados:', 9.5, { bold:true, color:'#5A6072' });
        l.cited_links.forEach(function(cl){
          text('→ '+(cl.label||domainOf(cl.url))+' — '+cl.url, 9, { color:'#3355CC', indent:8 });
        });
      }
      text('Original: '+l.raw_url, 8.5, { color:'#7A8194' });
      spacer(8);
      if(i < items.length-1){ rule(); }
    });
    spacer(12);
  });

  doc.save(rep.filename+'-'+todayFileStamp()+'.pdf');
}
function todayFromIso(iso){
  if(!iso) return 'data desconhecida';
  var d = new Date(iso);
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}

// ---------- exclusão (via Edge Function protegida por PIN) ----------
function getPin(){
  var pin = sessionStorage.getItem('cdl_pin');
  if(pin) return pin;
  pin = window.prompt('Digite o PIN do app pra confirmar:');
  if(pin) sessionStorage.setItem('cdl_pin', pin);
  return pin;
}

// Trata 401 (PIN errado) e 429 (bloqueado por tentativas) do mesmo jeito nas duas funções.
function pinError(res){
  return res.json().catch(function(){ return {}; }).then(function(j){
    sessionStorage.removeItem('cdl_pin');
    throw new Error(j.error || (res.status === 429 ? 'Muitas tentativas erradas. Aguarde 15 minutos.' : 'PIN incorreto.'));
  });
}

// Painel do app (chaves de API e revisão), protegido pelo mesmo PIN.
function callAdmin(action, payload){
  var pin = getPin();
  if(!pin) return Promise.reject(new Error('Cancelado — PIN não informado.'));
  var body = Object.assign({ action: action }, payload || {});
  return fetch(ADMIN_FN_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-pin': pin },
    body: JSON.stringify(body)
  }).then(function(res){
    if(res.status === 401 || res.status === 429){ return pinError(res); }
    return res.json().catch(function(){ return {}; }).then(function(j){
      if(!res.ok){ var err = new Error(j.error || ('Falha (HTTP '+res.status+').')); err.status = res.status; throw err; }
      return j;
    });
  });
}

function callDelete(type, id){
  var pin = getPin();
  if(!pin) return Promise.reject(new Error('Exclusão cancelada — PIN não informado.'));
  return fetch(DELETE_FN_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-pin': pin },
    body: JSON.stringify({ type: type, id: id })
  }).then(function(res){
    if(res.status === 401 || res.status === 429){ return pinError(res); }
    if(!res.ok){
      return res.json().catch(function(){ return {}; }).then(function(j){
        throw new Error(j.error || ('Falha ao excluir (HTTP '+res.status+').'));
      });
    }
    return res.json();
  });
}

function afterDelete(){
  return loadData().then(function(){ route(); });
}

// ---------- carrossel de imagens (fotos reais do post) ----------
function wireImageCarousels(root){
  root.querySelectorAll('.img-carousel').forEach(function(wrap){
    var strip = wrap.querySelector('.strip');
    var countEl = wrap.querySelector('.count');
    if(!strip) return;
    var total = strip.children.length;
    var thumbRow = wrap.parentElement ? wrap.parentElement.querySelector('.thumb-row') : null;

    function setActive(idx){
      if(countEl) countEl.textContent = (idx+1)+'/'+total;
      if(thumbRow){
        thumbRow.querySelectorAll('.thumb-btn').forEach(function(btn,i){
          btn.classList.toggle('active', i===idx);
        });
      }
    }

    strip.addEventListener('scroll', function(){
      var idx = Math.round(strip.scrollLeft / (strip.clientWidth || 1));
      idx = Math.max(0, Math.min(total-1, idx));
      setActive(idx);
    });

    if(thumbRow){
      thumbRow.querySelectorAll('.thumb-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var idx = parseInt(btn.getAttribute('data-idx'), 10) || 0;
          var target = strip.children[idx];
          if(target) strip.scrollTo({ left: target.offsetLeft, behavior: 'smooth' });
          setActive(idx);
        });
      });
    }
  });
}

async function downloadImages(urls, title){
  var base = slugify(title || 'imagem') || 'imagem';
  for(var i = 0; i < urls.length; i++){
    try{
      var res = await fetch(urls[i]);
      var blob = await res.blob();
      var ext = (blob.type && blob.type.indexOf('png') !== -1) ? 'png' : (blob.type && blob.type.indexOf('webp') !== -1) ? 'webp' : 'jpg';
      var blobUrl = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = blobUrl;
      a.download = urls.length > 1 ? (base+'-'+(i+1)+'.'+ext) : (base+'.'+ext);
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(u){ return function(){ URL.revokeObjectURL(u); }; }(blobUrl), 4000);
    }catch(e){
      console.error('falha ao baixar imagem', urls[i], e);
    }
    if(i < urls.length-1){ await new Promise(function(r){ setTimeout(r, 350); }); }
  }
}

function wireImageDownloadButtons(root){
  root.querySelectorAll('.btn-download-imgs').forEach(function(btn){
    btn.addEventListener('click', function(){
      var urls;
      try{ urls = JSON.parse(btn.getAttribute('data-download-urls')||'[]'); }catch(e){ urls = []; }

function validatePersonal(value){
  if(!value || value.version!==1 || !Array.isArray(value.folders) || !value.links || typeof value.links!=='object' || Array.isArray(value.links))throw new Error('O arquivo de organização não é válido.');
  if(value.folders.length>200 || Object.keys(value.links).length>20000)throw new Error('O arquivo de organização excede o limite.');
  var ids=new Set(),clean={folders:[],links:Object.create(null)};
  value.folders.forEach(function(f){
    if(!f || typeof f.id!=='string' || !/^[a-zA-Z0-9-]{1,80}$/.test(f.id) || ids.has(f.id) || typeof f.name!=='string' || !f.name.trim() || f.name.length>60)throw new Error('Há uma pasta inválida no arquivo.');
    ids.add(f.id);clean.folders.push({id:f.id,name:f.name.trim()});
  });
  Object.keys(value.links).forEach(function(id){
    var m=value.links[id];
    if(!/^[a-zA-Z0-9-]{1,80}$/.test(id) || !m || typeof m.favorite!=='boolean' || typeof m.folder!=='string' || !Array.isArray(m.tags) || m.tags.length>12 || m.tags.some(function(t){return typeof t!=='string'||t.length>40;}))throw new Error('Há um link inválido no arquivo.');
    clean.links[id]={favorite:m.favorite,folder:ids.has(m.folder)?m.folder:'',tags:Array.from(new Set(m.tags.map(function(t){return t.trim();}).filter(Boolean)))};
  });
  return clean;
}

function savePersonal(next){
  return Promise.resolve().then(function(){

function filteredLibrary(){
  var terms=searchTerms(searchQuery);

function openFolderDialog(id){
  if(!personalReady){ensurePersonal().then(function(){navigation();openFolderDialog(id);}).catch(function(err){notify(err.message,true);});return;}

  dialog.showModal();

function renderTema(catId){
  var cat = themeCategories().find(function(c){ return c.id === catId; });
  if(!state.loaded){ temaEl.innerHTML = stateBlock('Carregando…'); return; }
  if(!cat){ temaEl.innerHTML = stateBlock('Tema não encontrado.'); return; }

  var items = linksByCategory(catId);
  var videoN = items.filter(function(l){return isVideo(l.media_type);}).length;
  var citedTotal = items.reduce(function(s,l){return s+(l.cited_links?l.cited_links.length:0);},0);

  var html = '';
  html += '<div class="topbar">'
    + '<a href="#/" class="backbtn" aria-label="Voltar">'+ICO.back+'</a>'
    + (catId==='__uncategorized'?'':'<button class="tema-del-btn" id="btn-del-tema" type="button" aria-label="Excluir tema">'+ICO.trash+'</button>')
    + '</div>';

  html += '<div class="tema-head">'
    + '<div class="title-row"><span class="swatch" style="background:'+esc(cat.color)+'"></span><h1>'+esc(cat.name)+'</h1></div>'
    + '<div class="meta">'+items.length+' link'+(items.length===1?'':'s')+' · '+videoN+' vídeo'+(videoN===1?'':'s')+' · '+citedTotal+' link'+(citedTotal===1?'':'s')+' citado'+(citedTotal===1?'':'s')+' no total</div>'
    + '</div>';

  html += '<button class="btn-pdf" id="btn-pdf-tema" type="button" data-cat="'+esc(catId)+'">'+ICO.pdfsm+'Gerar PDF</button>';
  html += '<a href="#/relatorio/'+catId+'" style="font-size:11.5px;color:var(--ink-mute);text-align:center;margin-top:-8px">Ver prévia deste tema</a>';

  if(items.length === 0){
    html += stateBlock('Nenhum link neste tema ainda.');
  } else {
    items.forEach(function(l){ html += itemCard(l); });
  }

  temaEl.innerHTML = html;

  var btnPdfTema = document.getElementById('btn-pdf-tema');
  if(btnPdfTema){ btnPdfTema.addEventListener('click', function(){ openTemaPdfPicker(catId); }); }

  var btnDelTema = document.getElementById('btn-del-tema');
  if(btnDelTema){ btnDelTema.addEventListener('click', function(){ deleteCategoryFlow(catId, cat.name, items.length); }); }

  temaEl.querySelectorAll('.item-del').forEach(function(btn){
    btn.addEventListener('click', function(){
      deleteLinkFlow(btn.getAttribute('data-link-id'), btn.getAttribute('data-title'));
    });
  });

  wireImageCarousels(temaEl);
  wireImageDownloadButtons(temaEl);
  wireTranscripts(temaEl);
}

// Análise do vídeo: status, ferramentas citadas, textos da tela e transcrição (carregada sob demanda).
function videoSection(l){
  var st = l.video_status;
  if(!st){ return ''; }
  var html = '';
  if(st === 'pending' || st === 'downloading' || st === 'analyzing'){
    html += '<div class="vid-status"><span>🎬</span><span>'+(st==='pending' ? 'Na fila — aguardando o ajudante do Termux enviar o vídeo.' : st==='downloading' ? 'Baixando e enviando o vídeo pelo ajudante…' : 'Analisando fala e textos da tela…')+'</span></div>';
  } else if(st === 'failed' || st === 'no_video'){
    html += '<div class="vid-status warn"><span>⚠️</span><span>'+(st==='failed'?'A análise falhou após as tentativas disponíveis.':'Vídeo indisponível para análise.')+' A fala e os textos da tela ainda não foram confirmados.</span></div>';
  }
  if(st !== 'done'){ return html; }
  html += '<div class="vid-status"><span>✓</span><span>Vídeo analisado — resumo gerado por IA a partir do vídeo. Confira comandos e detalhes no original.</span></div>';
  var tools = Array.isArray(l.tools_cited) ? l.tools_cited : [];
  var screen = Array.isArray(l.screen_text) ? l.screen_text : [];
  if(tools.length){
    html += '<div><div class="item-label">FERRAMENTAS CITADAS</div><div class="tool-chips">'
      + tools.map(function(t){ return '<span class="tool-chip">'+esc(t)+'</span>'; }).join('')
      + '</div></div>';
  }
  if(screen.length){
    html += '<details class="vid-details"><summary>Textos que aparecem na tela ('+screen.length+')</summary>'
      + '<div class="vid-body"><p>Trechos extraídos da tela, na ordem capturada. Podem conter erros de leitura ou comandos incompletos.</p><ul>'+screen.map(function(t){ return '<li><span>'+esc(t)+'</span> <button type="button" class="vid-copy" data-copy-excerpt="'+esc(t)+'">Copiar trecho</button></li>'; }).join('')+'</ul></div></details>';
  }
  html += '<details class="vid-details" data-transcript-id="'+esc(l.id)+'"><summary>Transcrição da fala</summary>'
    + '<div class="vid-body">Abrindo…</div></details>';
  return html;
}

function wireTranscripts(root){
  root.querySelectorAll('details[data-transcript-id]').forEach(function(d){
    d.addEventListener('toggle', function(){
      if(!d.open || d.getAttribute('data-loaded')){ return; }
      var body = d.querySelector('.vid-body');
      body.textContent = 'Carregando transcrição…';
      sb.from('links').select('transcript').eq('id', d.getAttribute('data-transcript-id')).maybeSingle()
        .then(function(res){
          var t = res && res.data && res.data.transcript;
          if(res.error || !t){ body.textContent = res.error ? 'Não consegui carregar agora.' : 'Sem fala neste vídeo.'; return; }
          d.setAttribute('data-loaded','1');
          body.textContent = t;
          var btn = document.createElement('button');
          btn.type = 'button'; btn.className = 'vid-copy'; btn.textContent = 'Copiar transcrição';
          btn.addEventListener('click', function(){
            (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ btn.textContent = 'Copiado ✓'; }, function(){ btn.textContent = 'Não foi possível copiar'; });
          });
          d.appendChild(btn);
        });
    });
  });
}

function itemCard(l){
  var typeBadge = isVideo(l.media_type)
    ? '<div class="badge-video">'+ICO.playsm+esc((l.media_type||'vídeo').toUpperCase())+'</div>'
    : '<div class="badge-type">'+esc((l.media_type||'link').toUpperCase())+'</div>';

  var images = (l.link_images || []).slice().sort(function(a,b){ return a.position-b.position; });

  var html = '<article class="item-card">';
  html += '<div class="item-top">'+typeBadge+'<span class="item-author">'+esc(domainOf(l.raw_url))+' · '+esc(timeAgo(l.processed_at))+'</span>'
    + '<button class="item-del" type="button" data-link-id="'+esc(l.id)+'" data-title="'+esc(l.title||'')+'" aria-label="Excluir link">'+ICO.trash+'</button>'
    + '</div>';

  if(images.length){
    html += '<div class="img-carousel">';
    html += '<div class="strip">';
    images.forEach(function(im,i){ html += '<img src="'+esc(im.url)+'" loading="lazy" alt="" data-idx="'+i+'">'; });
    html += '</div>';
    if(images.length > 1){ html += '<div class="count">1/'+images.length+'</div>'; }
    html += '</div>';
    if(images.length > 1){
      html += '<div class="thumb-row">';
      images.forEach(function(im,i){
        html += '<button class="thumb-btn'+(i===0?' active':'')+'" type="button" data-idx="'+i+'" aria-label="Ver imagem '+(i+1)+'"><img src="'+esc(safeUrl(im.url))+'" loading="lazy" alt=""></button>';
      });
      html += '</div>';
    }
    html += '<button class="btn-download-imgs" type="button" data-download-urls="'+esc(JSON.stringify(images.map(function(im){return im.url;})))+'" data-download-title="'+esc(l.title||'imagem')+'">'
      + ICO.download + (images.length>1 ? 'Baixar '+images.length+' imagens' : 'Baixar imagem')
      + '</button>';
  }
  if(l.title){
    html += '<div><div class="item-label">TÍTULO</div><div class="item-title">'+esc(l.title)+'</div></div>';
  }
  if(l.caption){
    html += '<div><div class="item-label">DESCRIÇÃO DO POST</div><div class="item-caption">"'+esc(l.caption)+'"</div></div>';
  }
  if(l.needs_review){
    html += '<a href="#/revisar" class="review-chip">🟡 Revisar categoria'+(l.review_reason ? ' — '+esc(l.review_reason) : '')+'</a>';
  }
  if(l.summary){
    html += '<div><div class="item-label">'+(l.summary_inferred ? 'RESUMO ESTIMADO' : 'RESUMO')+'</div><div class="item-summary">'+esc(l.summary)+'</div></div>';
  }
  if(l.summary_inferred){
    html += '<div class="item-note">'+ICO.warn+'<span>O site não deixou ler o conteúdo; esse resumo foi deduzido pelo endereço e pelo título.</span></div>';
  } else if(!l.caption && !l.summary){
    html += '<div class="item-note">'+ICO.warn+'<span>O conteúdo não pôde ser lido automaticamente.</span></div>';
  }
  html += guideSection(l);
  html += videoSection(l);
  if(l.cited_links && l.cited_links.length){
    html += '<div class="cited-list"><div class="item-label">LINKS MENCIONADOS</div>';
    l.cited_links.forEach(function(c){
      html += '<a class="cited-link" href="'+esc(safeUrl(c.url))+'" target="_blank" rel="noopener">'+ICO.linksm+'<span>'+esc(c.label||domainOf(c.url))+'</span></a>';
    });
    html += '</div>';
  } else {
    html += '<div class="no-cited">Nenhum link citado neste conteúdo.</div>';
  }
  html += '<div class="orig-link">Original: <a href="'+esc(safeUrl(l.raw_url))+'" target="_blank" rel="noopener">'+esc(l.raw_url)+'</a></div>';
  html += '</article>';
  return html;
}

// ---------- relatório ----------
function renderRelatorio(onlyCatId){
  if(!state.loaded){ relatorioEl.innerHTML = stateBlock('Carregando…'); return; }

  var cats = onlyCatId ? themeCategories().filter(function(c){return c.id===onlyCatId;}) : themeCategories();
  var allItems = onlyCatId ? linksByCategory(onlyCatId) : state.links;
  var videoN = allItems.filter(function(l){return isVideo(l.media_type);}).length;
  var today = new Date();
  var dateStr = String(today.getDate()).padStart(2,'0')+'/'+String(today.getMonth()+1).padStart(2,'0')+'/'+today.getFullYear();

  var html = '';
  html += '<div class="topbar"><a href="#/" class="backbtn" aria-label="Voltar">'+ICO.back+'</a>'
    + '<button class="btn-accent" id="btn-pdf-relatorio" type="button" style="height:40px">'+ICO.pdfsm+'Baixar PDF</button></div>';
  html += '<div class="report-note">Esta é uma prévia de leitura, gerada ao vivo com seus dados atuais. Toque em <b>Baixar PDF</b> acima pra gerar o arquivo de verdade.</div>';

  html += '<div class="report-wrap"><div class="paper">';
  html += '<div class="paper-head">'
    + '<div><div class="eyebrow">CENTRAL DE LINKS</div><h2>Relatório'+(onlyCatId?' — '+esc(cats[0]?cats[0].name:''):' completo')+'</h2></div>'
    + '<div class="gen">Gerado em '+dateStr+'<br>'+cats.length+' tema'+(cats.length===1?'':'s')+' · '+allItems.length+' links · '+videoN+' vídeos</div>'
    + '</div>';

  if(cats.length === 0 || allItems.length === 0){
    html += '<div style="padding:20px 4px;color:#5A6072;font-size:12px">Sem conteúdo processado ainda pra este relatório.</div>';
  }

  cats.forEach(function(c, idx){
    var items = linksByCategory(c.id);
    if(items.length === 0) return;
    var vN = items.filter(function(l){return isVideo(l.media_type);}).length;
    html += '<div class="paper-section-head">'
      + '<span class="swatch" style="background:'+esc(c.color)+'"></span>'
      + '<span class="name">'+(idx+1)+'. '+esc(c.name)+'</span>'
      + '<span class="count">'+items.length+' links · '+vN+' vídeos</span>'
      + '</div>';

    items.forEach(function(l, i){
      html += '<div class="paper-item">';
      html += '<div class="t">'+(idx+1)+'.'+(i+1)+' '+esc(l.title||'(sem título)')+'</div>';
      html += '<div class="meta">'+esc((l.media_type||'link'))+' · '+esc(domainOf(l.raw_url))+'</div>';
      if(l.summary){ html += '<div class="sum"><b>'+(l.summary_inferred?'Resumo estimado (conteúdo não lido): ':'Resumo: ')+'</b>'+esc(l.summary)+'</div>'; }
      if(l.cited_links && l.cited_links.length){
        html += '<div class="links"><b>Links mencionados:</b><br>' + l.cited_links.map(function(c){
          return '→ <a href="'+esc(safeUrl(c.url))+'" target="_blank" rel="noopener" style="color:#3355CC">'+esc(c.label||domainOf(c.url))+'</a>';
        }).join('<br>') + '</div>';
      }
      html += '</div>';
      if(i < items.length-1) html += '<div class="paper-hr"></div>';
    });
  });

  html += '</div></div>';
  relatorioEl.innerHTML = html;

  var btnPdfRel = document.getElementById('btn-pdf-relatorio');
  if(btnPdfRel){
    btnPdfRel.addEventListener('click', function(){
      generatePdf(onlyCatId ? { type:'category', catId:onlyCatId } : { type:'all' });
    });
  }
}

// ---------- revisar categorias ----------
function catById(id){ return state.categories.find(function(c){ return c.id === id; }); }

function renderRevisar(){
  if(!state.loaded){ revisarEl.innerHTML = stateBlock('Carregando…'); return; }
  var items = state.links.filter(function(l){ return l.needs_review; });
  var html = '<div class="topbar"><a href="#/" class="backbtn" aria-label="Voltar">'+ICO.back+'</a></div>';
  html += '<div class="tema-head"><div class="title-row"><h1>Revisar</h1></div>'
    + '<div class="meta">A IA ficou em dúvida ou sugeriu outra categoria. Nada muda sem você decidir aqui.</div></div>';
  if(!items.length){
    revisarEl.innerHTML = html + stateBlock('Tudo revisado. 🎉');
    return;
  }
  var opts = state.categories.map(function(c){ return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'; }).join('');
  items.forEach(function(l){
    var cat = catById(l.category_id);
    var pend = l.pending_category;
    var pendIsNew = pend && !state.categories.some(function(c){ return c.name.toLowerCase() === pend.toLowerCase(); });
    html += '<div class="review-card" data-id="'+esc(l.id)+'">'
      + '<div class="t">'+esc(l.title||'(sem título)')+'</div>'
      + '<div class="row"><span class="badge" style="background:'+esc(cat?cat.color:'#7C9CFF')+'1F;color:'+esc(cat?cat.color:'#7C9CFF')+'">Agora: '+esc(cat?cat.name:'Sem tema')+'</span>'
      + (l.category_confidence!=null ? '<span class="recent-when">confiança '+Math.round(Number(l.category_confidence)*100)+'%</span>' : '')
      + '</div>'
      + (l.review_reason ? '<div class="why">'+esc(l.review_reason)+'</div>' : '')
      + (l.summary ? '<div class="item-summary" style="font-size:12px">'+esc(l.summary.length>220 ? l.summary.slice(0,220)+'…' : l.summary)+'</div>' : '')
      + '<div class="row">'
      + (pend ? '<button class="btn-soft primary" data-act="accept" type="button">'+(pendIsNew?'Criar tema "'+esc(pend)+'" e mover':'Mover para "'+esc(pend)+'"')+'</button>' : '')
      + '<button class="btn-soft" data-act="keep" type="button">Manter em '+esc(cat?cat.name:'Sem tema')+'</button>'
      + '</div>'
      + '<div class="row"><select class="sel" data-act="pick" aria-label="Escolher categoria para '+esc(l.title||'o link')+'"><option value="">Mover para outro tema…</option>'+opts+'<option value="__new">+ Novo tema…</option></select></div>'
      + '<div class="msg-slot"></div>'
      + '</div>';
  });
  revisarEl.innerHTML = html;

  revisarEl.querySelectorAll('.review-card').forEach(function(card){
    var id = card.getAttribute('data-id');
    var slot = card.querySelector('.msg-slot');
    function run(action, payload){
      card.querySelectorAll('button,select').forEach(function(b){ b.disabled = true; });
      callAdmin(action, Object.assign({ id: id }, payload||{})).then(function(){
        return loadData();
      }).then(function(){ renderRevisar(); }).catch(function(err){
        slot.innerHTML = '<div class="msg err">'+esc(err.message)+'</div>';
        card.querySelectorAll('button,select').forEach(function(b){ b.disabled = false; });
      });
    }
    card.querySelectorAll('button[data-act]').forEach(function(btn){
      btn.addEventListener('click', function(){ run(btn.getAttribute('data-act') === 'accept' ? 'review_accept' : 'review_keep'); });
    });
    var sel = card.querySelector('select[data-act="pick"]');
    sel.addEventListener('change', function(){
      if(!sel.value) return;
      if(sel.value === '__new'){
        var name = window.prompt('Nome do novo tema:');
        if(!name || !name.trim()){ sel.value = ''; return; }
        run('review_move', { new_category: name.trim() });
      } else {
        run('review_move', { category_id: sel.value });
      }
    });
  });
}

// ---------- configurações: chaves de API ----------
var keysState = { list: null, error: null, busy: false, msg: null };

function fmtWhen(iso){
  if(!iso) return '';
  var d = new Date(iso);
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function keyPill(k){
  if(!k.enabled) return '<span class="pill off">Desligada</span>';
  if(k.status === 'invalid') return '<span class="pill bad">Recusada pelo Google</span>';
  if(k.status === 'exhausted') return '<span class="pill warn">Esgotada até '+esc(fmtWhen(k.exhausted_until))+'</span>';
  return '<span class="pill ok">Ativa</span>';
}

function loadKeys(){
  keysState.busy = true; renderConfig();
  return callAdmin('keys_list').then(function(j){
    keysState.list = j.keys || []; keysState.error = null;
  }).catch(function(err){ keysState.error = err.message; })
    .then(function(){ keysState.busy = false; renderConfig(); });
}

function renderConfig(){
  var html = '<div class="topbar"><a href="#/" class="backbtn" aria-label="Voltar">'+ICO.back+'</a></div>';
  html += '<div class="tema-head"><div class="title-row"><h1>Configurações</h1></div>'
    + '<div class="meta">Chaves de API do Google (Gemini). O app usa a primeira ativa; quando ela esgota a cota do dia ou é recusada, passa sozinho para a próxima e te avisa no Telegram.</div></div>';

  if(keysState.msg){ html += '<div class="msg '+(keysState.msg.ok?'ok':'err')+'">'+esc(keysState.msg.text)+'</div>'; }

  if(keysState.list === null){
    html += keysState.error
      ? '<div class="msg err">'+esc(keysState.error)+'</div><button class="btn-soft" id="btn-keys-retry" type="button">Tentar de novo</button>'
      : stateBlock(keysState.busy ? 'Carregando chaves…' : 'As chaves ficam protegidas pelo PIN do app.<br><button class="btn-soft primary" id="btn-keys-open" type="button" style="margin-top:10px">Ver chaves</button>');
  } else {
    html += '<div class="section-label">Chaves cadastradas ('+keysState.list.length+')</div>';
    keysState.list.forEach(function(k, i){
      html += '<div class="key-card" data-id="'+esc(k.id)+'">'
        + '<div class="key-top"><b>'+(i+1)+'. '+esc(k.label)+'</b>'+keyPill(k)+'<span class="key-mask">'+esc(k.masked)+'</span></div>'
        + '<div class="key-meta">'+Number(k.uses||0)+' uso'+(Number(k.uses)===1?'':'s')
        + (k.last_used_at ? ' · último em '+esc(fmtWhen(k.last_used_at)) : '')
        + (k.last_error ? '<br>Último erro ('+esc(fmtWhen(k.last_error_at))+'): '+esc(String(k.last_error).slice(0,160)) : '')
        + '</div>'
        + '<div class="row" style="display:flex;flex-wrap:wrap;gap:6px">'
        + '<button class="btn-soft" data-act="test" type="button">Testar</button>'
        + (i>0 ? '<button class="btn-soft" data-act="first" type="button">Usar primeiro</button>' : '')
        + '<button class="btn-soft" data-act="toggle" data-enabled="'+(k.enabled?'0':'1')+'" type="button">'+(k.enabled?'Desligar':'Ligar')+'</button>'
        + '<button class="btn-soft danger" data-act="remove" type="button">Remover</button>'
        + '</div></div>';
    });

    html += '<div class="form-card">'
      + '<div class="section-label">Adicionar chave</div>'
      + '<label class="field">Nome da chave<input class="inp" id="key-label" type="text" maxlength="40" placeholder="Nome (ex.: Conta 2)"></label>'
      + '<label class="field">Chave do Google AI Studio<input class="inp" id="key-value" type="password" autocomplete="off" placeholder="Cole a chave do Google AI Studio"></label>'
      + '<button class="btn-soft primary" id="btn-key-add" type="button"'+(keysState.busy?' disabled':'')+'>'+(keysState.busy?'Testando…':'Testar e salvar')+'</button>'
      + '<div class="hint">A chave é testada com o Google antes de salvar e nunca volta inteira para o navegador. Crie em aistudio.google.com → Get API key.</div>'
      + '</div>';
  }
  html += '<details class="danger-details"><summary>Zona de risco</summary><div class="danger-zone"><div class="txt"><b>Excluir toda a biblioteca</b>Apaga todos os temas e links. Exige confirmação e PIN.</div><button class="danger-btn" id="btn-delete-all" type="button">'+ICO.trash+'Excluir tudo</button></div></details>';
  configEl.innerHTML = html;
  document.getElementById('btn-delete-all').addEventListener('click',deleteAllFlow);

  var open = document.getElementById('btn-keys-open') || document.getElementById('btn-keys-retry');
  if(open){ open.addEventListener('click', function(){ keysState.error = null; loadKeys(); }); }

  function act(action, payload, okText){
    keysState.busy = true; keysState.msg = null; renderConfig();
    return callAdmin(action, payload).then(function(j){
      if(j.keys) keysState.list = j.keys;
      var t = j.test;
      keysState.msg = t ? { ok: !!t.ok, text: t.ok ? (okText||'Pronto.')+' A chave '+t.detail+'.' : 'Salvo, mas o teste falhou: '+t.detail } : { ok: true, text: okText||'Pronto.' };
    }).catch(function(err){ keysState.msg = { ok:false, text: err.message }; })
      .then(function(){ keysState.busy = false; renderConfig(); });
  }

  configEl.querySelectorAll('.key-card').forEach(function(card){
    var id = card.getAttribute('data-id');
    card.querySelectorAll('button[data-act]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var a = btn.getAttribute('data-act');
        if(a === 'test') act('keys_test', { id: id }, 'Teste ok.');
        else if(a === 'first') act('keys_first', { id: id }, 'Essa chave agora é a primeira da fila.');
        else if(a === 'toggle') act('keys_toggle', { id: id, enabled: btn.getAttribute('data-enabled') === '1' }, 'Atualizado.');
        else if(a === 'remove'){
          if(window.confirm('Remover esta chave do app? (Ela continua existindo na sua conta Google.)')) act('keys_remove', { id: id }, 'Chave removida.');
        }
      });
    });
  });

  var add = document.getElementById('btn-key-add');
  if(add){
    add.addEventListener('click', function(){
      var key = (document.getElementById('key-value').value || '').trim();
      var label = (document.getElementById('key-label').value || '').trim();
      if(!key){ keysState.msg = { ok:false, text:'Cole a chave antes de salvar.' }; renderConfig(); return; }
      act('keys_add', { api_key: key, label: label }, 'Chave adicionada.');
    });
  }
}

// ---------- router ----------
function route(){
  var hash = location.hash || '#/';
  activeTopic='';topicView=false;
  navigation();
  homeEl.classList.add('hidden');
  temaEl.classList.add('hidden');
  relatorioEl.classList.add('hidden');
  revisarEl.classList.add('hidden');
  configEl.classList.add('hidden');

  if(state.error && hash.indexOf('#/config') !== 0){
    homeEl.classList.remove('hidden');renderHome();return;
  }

  if(hash==='#/guias'){homeEl.classList.remove('hidden');topicView=true;renderGuides();window.scrollTo(0,0);return;}
  var topicMatch=hash.match(/^#\/assunto\/([^/]+)$/);
  if(topicMatch){activeTopic=decodeRoute(topicMatch[1]);libraryView='all';activeFolder='';searchQuery='';filterCategory='';filterType='all';filterAnalysis='all';visibleLimit=12;homeEl.classList.remove('hidden');renderHome();window.scrollTo(0,0);return;}
  var linkMatch = hash.match(/^#\/link\/([^/]+)$/);
  if(linkMatch){
    temaEl.classList.remove('hidden');renderLink(decodeRoute(linkMatch[1]));window.scrollTo(0,0);return;
  }

  if(hash.indexOf('#/revisar') === 0){
    revisarEl.classList.remove('hidden');
    renderRevisar();
    window.scrollTo(0,0);
    return;
  }
  if(hash.indexOf('#/config') === 0){
    configEl.classList.remove('hidden');
    renderConfig();
    window.scrollTo(0,0);
    return;
  }

  var temaMatch = hash.match(/^#\/tema\/([^\/]+)/);
  var relMatch = hash.match(/^#\/relatorio(?:\/([^\/]+))?/);

  if(temaMatch){
    temaEl.classList.remove('hidden');
    renderTema(temaMatch[1]);
  } else if(relMatch){
    relatorioEl.classList.remove('hidden');
    renderRelatorio(relMatch[1]||null);
  } else {
    var folderMatch = hash.match(/^#\/pasta\/([^/]+)$/);
    var nextView = hash === '#/favoritos' ? 'favorites' : hash === '#/pastas' ? 'folders' : folderMatch ? 'folder' : 'all';
    var nextFolder = folderMatch ? decodeRoute(folderMatch[1]) : '';
    if(libraryView !== nextView || activeFolder !== nextFolder){ searchQuery='';filterCategory='';filterType='all';filterAnalysis='all';visibleLimit=12; }
    libraryView = nextView;activeFolder = nextFolder;
    homeEl.classList.remove('hidden');
    renderHome();
  }
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', route);

Promise.all([loadData(), loadPersonal()]).then(route);
route(); // primeira pintura já com o estado de "carregando"

})();
</script>
